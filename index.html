<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliana Bolos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">


            <div class="header-left">
                <img class="img-logo" src="/assets/imagens/logo.png">
                <div class="logo-text">
                    <a href="index.html">
                    <h1>Eliana Bolos</h1>
                    <p id="subtitulo-menu">Bolos artesanais feitos com muito carinho</p>
                    </a>
                </div>
            </div>


            <button class="menu-button">☰</button>

            <div class="nav-links">

                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Menu</a></li>
                    <li><a href="#">Sobre</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>

            </div>
        </nav>
    </header>

    <div class="overlay"></div>
    
    <main>

        <section class="hero">

            <div class="hero-text">

                <h2>Bolos artesanais feitos com carinho</h2>

                <p>
                    Transformando momentos especiais em memórias doces. <br>
                    Encomende já o seu!
                </p>

                <button>Faça seu pedido</button>

            </div>

            <img
                    src="https://images.unsplash.com/photo-1578985545062-69928b1d9587"
                    alt="Bolo artesanal decorado">

        </section>

        <div class="produtos">
            <h2>Produtos</h2>
            <div class="produtos-mural">
                <div class="produto-item">
                    <p>Bolos</p>
                    <img src="/assets/imagens/bolo.jpg">
                </div>
                <div class="produto-item">
                    <p>Pudim</p>
                    <img src="/assets/imagens/pudim.jpg">
                </div>
                <div class="produto-item">
                    <p>Ovos de Páscoa</p>
                    <img src="/assets/imagens/ovo-pascoa.jpg">
                </div>
            </div>
            <button>Acesse Nosso Menu</button>
            
        </div>

    </main>

    <footer>
        <div class="">
            <p>Acompanhe</p>
            <div class="redes-sociais">
                <div class="link-rede">
                    <img src="/assets/icons/insta.png">
                    <a href="">Instagram</a>
                </div>
                <div class="link-rede">
                    <img src="/assets/icons/whatsapp.png">
                    <a href="">Whatsapp</a>
                </div>
                <div class="link-rede">
                    <img src="/assets/icons/facebook.png">
                    <a href="">Facebook</a>
                </div>
            </div>

        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
